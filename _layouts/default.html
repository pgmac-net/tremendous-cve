<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {{ page.cve_id }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.tagline | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
{{ content }}
<footer>
  {% if page.layout == 'cve' %}
  <p>⚠️ This is satire, but <a href="{{ page.nvd_url }}">{{ page.cve_id }}</a> is a real
  vulnerability. Read the official NVD entry and patch your systems. ⚠️</p>
  {% endif %}
  <p>🇺🇸 Made with TREMENDOUS energy. The vulnerabilities are real. The merchandise is not. 🇺🇸</p>
  <p><a href="{{ '/' | relative_url }}">← back to the catalog</a></p>
</footer>
</body>
</html>
