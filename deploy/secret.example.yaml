# Create the secret out-of-band (do NOT commit real values).
#   kubectl -n tremendous-cve create secret generic tremendous-cve \
#     --from-literal=UPLOAD_TOKEN=$(openssl rand -hex 24)
# Generation happens in the local CLI (which uses your own Claude auth),
# so no ANTHROPIC_API_KEY is needed in the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: tremendous-cve
  namespace: tremendous-cve
type: Opaque
stringData:
  UPLOAD_TOKEN: "REPLACE_WITH_RANDOM_TOKEN"
