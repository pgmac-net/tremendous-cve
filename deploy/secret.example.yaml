# Create the secret out-of-band (do NOT commit real values).
#   kubectl -n tremendous-cve create secret generic tremendous-cve \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=GENERATE_TOKEN=$(openssl rand -hex 24)
apiVersion: v1
kind: Secret
metadata:
  name: tremendous-cve
  namespace: tremendous-cve
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-REPLACE_ME"
  GENERATE_TOKEN: "REPLACE_WITH_RANDOM_TOKEN"
