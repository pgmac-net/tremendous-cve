name: Lint & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    # Fork PRs must not run on the internal self-hosted runner (RCE risk).
    # Only same-repo branches and pushes reach the runner.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check

      - name: Pylint
        run: uv run pylint src/

      - name: Pytest
        run: uv run pytest
