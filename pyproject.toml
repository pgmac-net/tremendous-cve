[project]
name = "tremendous-cve"
version = "0.1.0"
description = "The HUGEST, most TREMENDOUS CVE pages in the history of computing. Translates NIST NVD CVE reports into satirical product-launch pages."
readme = "README.md"
authors = [
    { name = "Paul Macdonnell", email = "pgmac@pgmac.net" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
tremendous-cve = "tremendous_cve.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
